[tools]
hugo = "0.136.5"

[env]
HUGO_VERSION = "0.136.5"

[tasks.build]
description = "Build Hugo site"
run = "hugo --minify"

[tasks.deploy]
  description = "Deploy Hugo site to GitHub Pages"
  run = "hugo --minify && git push origin main"

[tasks.full-deploy]
    description = "Full deployment: build and deploy Hugo site"
    run = "hugo --minify && git push origin main"