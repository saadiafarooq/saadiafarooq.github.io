---
name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          tools: |
            hugo@0.136.5

      - name: Cache Hugo cache
        uses: actions/cache@v4
        with:
          path: |
            .hugo_cache
            public
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/hugo.lock') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build site
        run: mise run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4